name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: ./scripts/build_app.sh
      - run: codesign --verify --verbose "build/Wispr Assist.app"
      - uses: actions/upload-artifact@v4
        with:
          name: WisprAssist-app
          path: build/Wispr Assist.app
