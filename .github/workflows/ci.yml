name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Lint
        run: swift format lint --strict -r Sources Tests
      - run: swift build
      - run: swift test
      - name: Build app bundle
        run: ./scripts/build_app.sh
      - run: codesign --verify --strict --verbose "build/Wispr Assist.app"
      - uses: actions/upload-artifact@v4
        with:
          name: WisprAssist-app
          path: build/Wispr Assist.app
